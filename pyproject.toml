[project]
name = "condition-scout"
version = "0.1.0"
description = "Van Radar photo evidence tool: listing photos in, structured image-cited condition evidence out."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pydantic>=2.7",
    "google-genai>=1.0",
]

[project.scripts]
condition-scout = "condition_scout.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/condition_scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that hit real network endpoints and the real Gemini API (CI live-smoke job only; requires GEMINI_API_KEY)",
]
# The default suite is fully faked: exclude live tests unless -m live is passed.
addopts = "-m 'not live'"
